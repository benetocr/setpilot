name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - run: node dev/test_engine.js
      - run: SP_BRIDGE=1 node dev/test_engine.js
      - run: SP_BRIDGE=1 SP_WRITE_DELAY=5 node dev/test_engine.js
      - run: python3 -m unittest discover -s live/tests
      - run: node dev/test_setup.js
      - run: node dev/e2e.js
      - run: node dev/e2e_plugins.js
      - run: node dev/test_prepare.js
      - run: node dev/test_import_live.js
      - run: node dev/test_medley_live.js
      - run: node dev/test_autoprep.js
      - run: node dev/test_sets.js
      - run: node dev/test_audio_devices.js
      - run: node dev/test_songs.js
      - run: node dev/test_stems_dsp.js
      - run: node dev/test_stems.js
      - run: node dev/test_cue_words.js
      - run: node dev/test_medley_meter.js
      - run: g++ -std=c++17 -O2 -I plugin/src plugin/tests/core_test.cpp -o core_test && ./core_test

  plugin-mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build AU and VST3 (universal)
        run: |
          cmake -S plugin -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build --config Release --target SetPilotAudio_AU SetPilotAudio_VST3 -- -quiet
      - name: Sign (ad hoc) and check
        run: |
          A=build/SetPilotAudio_artefacts/Release
          codesign --force --deep -s - "$A/AU/SetPilot Audio.component"
          codesign --force --deep -s - "$A/VST3/SetPilot Audio.vst3"
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$A/AU/SetPilot Audio.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Spau Stpl | tail -20
      - name: Pack
        run: |
          cd build/SetPilotAudio_artefacts/Release
          ditto -c -k --keepParent "AU/SetPilot Audio.component" "$GITHUB_WORKSPACE/SetPilot-Audio-AU.zip"
          ditto -c -k --keepParent "VST3/SetPilot Audio.vst3" "$GITHUB_WORKSPACE/SetPilot-Audio-VST3.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: SetPilot-Audio-mac
          path: SetPilot-Audio-*.zip

  # whisper.cpp and its model, to hear the guide's spoken cues (built once, then cached)
  whisper-mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: wcache
        with:
          path: whisper-dist
          key: whisper-v1.7.5-base-q5_1-universal-2
      - name: Build whisper.cpp (universal) and get the model
        if: steps.wcache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v1.7.5 https://github.com/ggml-org/whisper.cpp wsrc
          cmake -S wsrc -B wbuild -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DBUILD_SHARED_LIBS=OFF -DGGML_METAL=OFF -DGGML_NATIVE=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DWHISPER_SDL2=OFF
          cmake --build wbuild --config Release -j 4 --target whisper-cli
          mkdir -p whisper-dist/models
          cp wbuild/bin/whisper-cli whisper-dist/
          otool -L whisper-dist/whisper-cli
          lipo -info whisper-dist/whisper-cli
          codesign --force -s - whisper-dist/whisper-cli
          curl -fL -o whisper-dist/models/ggml-base-q5_1.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin
          ls -la whisper-dist whisper-dist/models
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Hear spoken cues (English and Spanish)
        run: SETPILOT_WHISPER_DIR="$PWD/whisper-dist" node dev/test_hear.js
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-mac
          path: whisper-dist

  app-mac:
    needs: [plugin-mac, whisper-mac]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: SetPilot-Audio-mac, path: plugin-zips }
      - name: Put SetPilot Audio inside the app
        run: |
          mkdir -p plugin-dist
          for z in plugin-zips/*.zip; do ditto -x -k "$z" plugin-dist; done
          ls plugin-dist
      - name: Build the audio outputs helper
        run: |
          mkdir -p native-dist
          clang -arch arm64 -arch x86_64 -O2 -mmacosx-version-min=11.0 -o native-dist/sp-audio-outputs native/audio_outputs.c -framework CoreAudio -framework CoreFoundation
          codesign --force -s - native-dist/sp-audio-outputs
          ./native-dist/sp-audio-outputs
      - uses: actions/download-artifact@v4
        with: { name: whisper-mac, path: native-dist }
      - name: whisper.cpp inside the app
        run: |
          chmod +x native-dist/whisper-cli
          codesign --force -s - native-dist/whisper-cli
          ls -la native-dist native-dist/models
      - run: npm ci
      - run: npx electron-builder --mac zip --arm64 --x64 -c.mac.identity=null
      - name: Sign ad hoc, zip and make the disk images
        run: |
          for a in dist/mac*/SetPilot.app; do codesign --force --deep -s - "$a"; codesign --verify --deep "$a"; done
          pack() {
            local dir="$1" arch="$2"
            ditto -c -k --keepParent "$dir/SetPilot.app" "$GITHUB_WORKSPACE/SetPilot-mac-$arch.zip"
            local stage="$RUNNER_TEMP/dmg-$arch"
            rm -rf "$stage"; mkdir -p "$stage"
            ditto "$dir/SetPilot.app" "$stage/SetPilot.app"
            ln -s /Applications "$stage/Applications"
            hdiutil create -volname "SetPilot" -srcfolder "$stage" -ov -format UDZO "$GITHUB_WORKSPACE/SetPilot-mac-$arch.dmg"
          }
          pack dist/mac-arm64 arm64
          pack dist/mac x64
      - uses: actions/upload-artifact@v4
        with:
          name: SetPilot-app-mac
          path: |
            SetPilot-mac-*.zip
            SetPilot-mac-*.dmg

  # the builds go to the "latest" pre-release (files over 100 MB do not fit in git)
  publish:
    needs: [tests, plugin-mac, app-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          echo "${GITHUB_SHA}" > COMMIT
          ls -la
          gh release view latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create latest -R "$GITHUB_REPOSITORY" --prerelease --title "Latest build" --notes "Built from main on every push."
          gh release upload latest -R "$GITHUB_REPOSITORY" --clobber COMMIT SetPilot-* 
          gh release edit latest -R "$GITHUB_REPOSITORY" --notes "Built from ${GITHUB_SHA} on $(date -u +%Y-%m-%dT%H:%MZ)."
